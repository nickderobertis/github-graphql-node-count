# Publish the tagged version to crates.io.
#
# Triggered by the `vX.Y.Z` tag release-plz pushes. It builds and publishes an
# already-swept commit — the release PR's own run is where this tree was gated —
# so it re-runs no lint, type-check or test target. See "Commits, releases, and
# merging" in AGENTS.md.
#
# Nothing here is dispatched by hand: the only human action in a release is
# merging the release PR.

name: release

on:
  push:
    tags: ["v*"]

permissions:
  contents: read

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  publish-crate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: taiki-e/install-action@v2
        with:
          tool: just

      # `just toolchain` is the one place the pinned toolchain is provisioned, so
      # a release build cannot compile against a different compiler than the gate.
      - name: Install the pinned toolchain
        run: just toolchain

      # Everything the publish refuses on — a tag that is not vX.Y.Z, a tag naming
      # a version the manifest does not, a missing credential — lives in the
      # script, where it is tested. The tag name reaches it as an argument rather
      # than interpolated into a shell.
      - name: Publish github-graphql-node-count to crates.io
        env:
          CARGO_REGISTRY_TOKEN: ${{ secrets.CARGO_REGISTRY_TOKEN }}
          TAG_NAME: ${{ github.ref_name }}
        run: ./scripts/publish-crate.sh "$TAG_NAME"
