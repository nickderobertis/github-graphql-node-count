# Publish the tagged version to crates.io.
#
# Triggered by the `vX.Y.Z` tag release-plz pushes. It builds and publishes an
# already-swept commit — the release PR's own run is where this tree was gated —
# so it re-runs no lint, type-check or test target. See "Commits, releases, and
# merging" in AGENTS.md.
#
# Nothing here is dispatched by hand: the only human action in a release is
# merging the release PR.

name: release

on:
  push:
    tags: ["v*"]

permissions:
  contents: read

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  publish-crate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: taiki-e/install-action@v2
        with:
          tool: just

      # `just toolchain` is the one place the pinned toolchain is provisioned, so
      # a release build cannot compile against a different compiler than the gate.
      - name: Install the pinned toolchain
        run: just toolchain

      # Idempotent: a version already live on crates.io is skipped, so re-running
      # after a partial failure is safe. The tag name arrives through `env` rather
      # than interpolated into the shell.
      - name: Publish github-graphql-node-count to crates.io
        env:
          CARGO_REGISTRY_TOKEN: ${{ secrets.CARGO_REGISTRY_TOKEN }}
          TAG_NAME: ${{ github.ref_name }}
        run: |
          set -euo pipefail
          if [ -z "${CARGO_REGISTRY_TOKEN:-}" ]; then
            echo "::error::CARGO_REGISTRY_TOKEN is not set, so the tagged version" \
                 "cannot be published. Add it under Settings -> Secrets and" \
                 "variables -> Actions." >&2
            exit 1
          fi
          # The tag arrives from the event, so its shape is validated at the
          # boundary rather than trusted, and it must agree with the version the
          # release PR wrote into the manifest — a tag naming any other version
          # would publish something nobody reviewed.
          version="${TAG_NAME#v}"
          if [[ ! "${version}" =~ ^[0-9]+\.[0-9]+\.[0-9]+(-[0-9A-Za-z.-]+)?$ ]]; then
            echo "::error::tag '${TAG_NAME}' is not vX.Y.Z; refusing to publish." >&2
            exit 1
          fi
          manifest_version="$(
            cargo metadata --no-deps --format-version 1 --manifest-path Cargo.toml |
              python3 -c 'import json,sys; print(next(p["version"] for p in json.load(sys.stdin)["packages"] if p["name"] == "github-graphql-node-count"))'
          )"
          if [ "${version}" != "${manifest_version}" ]; then
            echo "::error::tag '${TAG_NAME}' names ${version} but the manifest says" \
                 "${manifest_version}; refusing to publish a version nobody reviewed." >&2
            exit 1
          fi
          if curl --silent --fail --max-time 30 \
               "https://crates.io/api/v1/crates/github-graphql-node-count/${version}" \
               >/dev/null; then
            echo "github-graphql-node-count ${version} is already on crates.io; nothing to do"
            exit 0
          fi
          cargo publish --locked --manifest-path crates/github-graphql-node-count/Cargo.toml
